models:
  - name: stg_models
    description: "Cleaned and deduplicated Hugging Face model metadata."
    columns:
      - name: model_id
        description: "Unique identifier of the Hugging Face model."
        tests:
          - not_null
          - unique

      - name: author
        description: "User or organization that owns the model."
        tests:
          - not_null

      - name: pipeline_tag
        description: "Task category associated with the model."

      - name: library_name
        description: "Library used by the model."

      - name: downloads
        description: "Number of model downloads, defaulting to zero when missing."
        tests:
          - not_null
          - value_greater_than_or_equal_to:
              min_value: 0

      - name: likes
        description: "Number of likes, defaulting to zero when missing."
        tests:
          - not_null
          - value_greater_than_or_equal_to:
              min_value: 0

      - name: is_private
        description: "Whether the model is private, defaulting to false when missing."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: gated_status
        description: "Access-gating status of the model."
        tests:
          - not_null
          - accepted_values:
              values: [None, "auto", "False", "manual"]

      - name: license
        description: "License associated with the model."

      - name: base_model
        description: "Base model from which this model was derived, when available."

      - name: language
        description: "Language or languages associated with the model."

      - name: datasets
        description: "Datasets associated with the model."

      - name: tags
        description: "Tags associated with the model."
        tests:
          - not_null

      - name: created_at
        description: "Timestamp when the model was created."
        tests:
          - not_null

      - name: last_modified
        description: "Timestamp when the model was last modified."
        tests:
          - not_null
